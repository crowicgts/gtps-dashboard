<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTPS Live Server Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c1220;
            --bg-card: #121b2e;
            --border-gold: #d6a849;
            --gold-glow: rgba(214, 168, 73, 0.25);
            --text-gold: #ffd269;
            --text-white: #ffffff;
            --text-muted: #8c9bb5;
            --online-green: #10b981;
            --offline-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #16243d 0%, var(--bg-main) 100%);
            color: var(--text-white);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            box-shadow: 0 8px 30px var(--gold-glow);
            margin-bottom: 24px;
        }

        .logo-title h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-gold);
            letter-spacing: 1px;
        }

        .logo-title p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-gold);
            padding: 8px 18px;
            border-radius: 30px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--offline-red);
            box-shadow: 0 0 10px var(--offline-red);
        }

        .status-dot.online {
            background: var(--online-green);
            box-shadow: 0 0 12px var(--online-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(214, 168, 73, 0.3);
            padding: 20px;
            border-radius: 10px;
        }

        .stat-card h3 {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-gold);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(214, 168, 73, 0.2);
        }

        .panel-header h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            color: var(--text-gold);
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(8, 14, 26, 0.6);
            border: 1px solid rgba(214, 168, 73, 0.2);
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .player-card:hover {
            border-color: var(--border-gold);
            background: rgba(22, 34, 58, 0.8);
        }

        .player-info .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-white);
        }

        .player-info .world {
            font-size: 12px;
            color: #60a5fa;
        }

        .player-stats {
            text-align: right;
            font-size: 13px;
        }

        .player-stats .gems {
            color: #fbbf24;
            font-weight: 600;
        }

        .player-stats .level {
            color: var(--text-muted);
            font-size: 11px;
        }

        .terminal {
            background: #050811;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 14px;
            height: 480px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .log-entry {
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-all;
        }

        .log-time { color: #64748b; margin-right: 6px; }
        .log-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 6px;
            text-transform: uppercase;
        }
        .tag-login { background: #065f46; color: #34d399; }
        .tag-logout { background: #7f1d1d; color: #f87171; }
        .tag-chat { background: #1e3a8a; color: #93c5fd; }
        .tag-world { background: #581c87; color: #c084fc; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-title">
                <h1>GROWTOPIA SERVER DASHBOARD</h1>
                <p>Live Real-Time Server & Logs Monitor</p>
            </div>
            <div class="server-status-pill">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText" style="font-weight: 600; font-size: 14px;">CHECKING...</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Server Port</h3>
                <div class="value" id="serverPort">25741</div>
            </div>
            <div class="stat-card">
                <h3>Online Players</h3>
                <div class="value" id="onlineCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Status</h3>
                <div class="value" id="statusState" style="color: var(--online-green);">ONLINE</div>
            </div>
            <div class="stat-card">
                <h3>Live Sync Interval</h3>
                <div class="value">3s</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-header">
                    <h2>Online Players</h2>
                    <span id="playerBadge" style="color: var(--text-gold); font-size: 13px;">0 Active</span>
                </div>
                <div class="player-list" id="playerList">
                    <div class="empty-state">No players online or server offline.</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Live Server Logs Stream</h2>
                    <span style="color: var(--text-muted); font-size: 12px;">Real-Time</span>
                </div>
                <div class="terminal" id="terminalLogs">
                    <div class="empty-state">Connecting to server log feed...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatNumber(num) {
            return Number(num || 0).toLocaleString();
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const isOnline = data.status === 'ONLINE';
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                const statusState = document.getElementById('statusState');

                if (isOnline) {
                    statusDot.className = 'status-dot online';
                    statusText.innerText = 'SERVER ONLINE';
                    statusText.style.color = 'var(--online-green)';
                    statusState.innerText = 'ONLINE';
                    statusState.style.color = 'var(--online-green)';
                } else {
                    statusDot.className = 'status-dot';
                    statusText.innerText = 'SERVER OFFLINE';
                    statusText.style.color = 'var(--offline-red)';
                    statusState.innerText = 'OFFLINE';
                    statusState.style.color = 'var(--offline-red)';
                }

                document.getElementById('serverPort').innerText = data.port || 25741;
                document.getElementById('onlineCount').innerText = data.playerCount || 0;
                document.getElementById('playerBadge').innerText = `${data.playerCount || 0} Active`;

                const playerList = document.getElementById('playerList');
                if (data.players && data.players.length > 0) {
                    playerList.innerHTML = data.players.map(p => `
                        <div class="player-card">
                            <div class="player-info">
                                <div class="name">👑 ${p.name}</div>
                                <div class="world">📍 World: <b>${p.world}</b></div>
                            </div>
                            <div class="player-stats">
                                <div class="gems">💎 ${formatNumber(p.gems)} Gems</div>
                                <div class="level">Level ${p.level} • ${p.wl} WL</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    playerList.innerHTML = '<div class="empty-state">No players online right now.</div>';
                }

                const terminalLogs = document.getElementById('terminalLogs');
                if (data.logs && data.logs.length > 0) {
                    terminalLogs.innerHTML = data.logs.map(log => {
                        let tagClass = 'tag-chat';
                        if (log.type === 'LOGIN') tagClass = 'tag-login';
                        if (log.type === 'LOGOUT') tagClass = 'tag-logout';
                        if (log.type === 'WORLD') tagClass = 'tag-world';

                        return `
                            <div class="log-entry">
                                <span class="log-time">[${log.time}]</span>
                                <span class="log-tag ${tagClass}">${log.type}</span>
                                <span>${log.text}</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    terminalLogs.innerHTML = '<div class="empty-state">No recent logs recorded.</div>';
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>
</html>
